[tox]
envlist = py39,py310,py311,py312,lint,type
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov>=4.0
    pyspark>=3.3.0
    pyarrow>=10.0.0
commands =
    pytest {posargs:tests} --cov=spark_testgen --cov-report=term-missing

[testenv:lint]
deps = ruff>=0.1.0
commands = 
    ruff check src tests
    ruff format --check src tests

[testenv:type]
deps = 
    mypy>=1.0
commands = mypy src

[testenv:format]
deps = ruff>=0.1.0
commands = ruff format src tests
