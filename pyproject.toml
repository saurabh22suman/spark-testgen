[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-testgen"
dynamic = ["version"]
description = "Auto-generate pytest test suites for PySpark DataFrame transformations"
readme = "Readme.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "spark-testgen contributors"}
]
keywords = [
    "pyspark",
    "testing",
    "pytest",
    "dataframe",
    "test-generation",
    "spark",
    "data-engineering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
    "Typing :: Typed",
]

dependencies = [
    "pyspark>=3.3.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "tox>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/saurabh22suman/spark-testgen"
Documentation = "https://github.com/saurabh22suman/spark-testgen#readme"
Repository = "https://github.com/saurabh22suman/spark-testgen.git"
Issues = "https://github.com/saurabh22suman/spark-testgen/issues"
Changelog = "https://github.com/saurabh22suman/spark-testgen/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark_testgen = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/spark_testgen/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

# ============ Tool Configurations ============

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]
exclude = ["src/spark_testgen/_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["spark_testgen"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring full Spark session",
]

[tool.coverage.run]
source = ["src/spark_testgen"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
